<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automatic Quiz Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">📝 Automatic Quiz Generator</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="row">
            <!-- INPUT -->
            <div class="col-md-6">
                <label class="form-label">Enter Text</label>
                <textarea class="form-control" name="text" rows="10"></textarea>

                <label class="form-label mt-3">Or Upload PDF</label>
                <input type="file" class="form-control" name="file">
            </div>

            <!-- SETTINGS -->
            <div class="col-md-6">
                <label class="form-label">Question Type</label>
                <select class="form-select" name="q_type">
                    <option value="MCQ">Multiple Choice</option>
                    <option value="Fill-in">Fill in the Blanks</option>
                    <option value="T-F">True / False</option>
                </select>

                <label class="form-label mt-3">Difficulty</label>
                <select class="form-select" name="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <button class="btn btn-success mt-4 w-100">
                    Generate Quiz
                </button>
            </div>
        </div>
    </form>

    {% if quiz %}
    <hr>
    <h4>Generated Quiz</h4>

    {% for q, ans, opts in quiz %}
    <div class="card mb-3">
        <div class="card-body">
            <strong>Q{{ loop.index }}:</strong> {{ q }}

            {% if opts %}
                {% set letters = ['A','B','C','D'] %}
                <div class="mt-2">
                {% for opt in opts %}
                    <div>{{ letters[loop.index0] }}. {{ opt }}</div>
                {% endfor %}
                </div>
            {% endif %}

            <p class="text-muted mt-2">Answer: {{ ans }}</p>
        </div>
    </div>
    {% endfor %}

    <!-- EXPORT PDF -->
    <form method="POST" action="/export_pdf">
        <textarea name="quiz_data" hidden>
{% for q, ans, opts in quiz %}
Q{{ loop.index }}: {{ q }}
{% if opts %}
{% set letters = ['A','B','C','D'] %}
{% for opt in opts %}
{{ letters[loop.index0] }}. {{ opt }}
{% endfor %}
{% endif %}
Answer: {{ ans }}

{% endfor %}
        </textarea>
        <button class="btn btn-primary">Export to PDF</button>
    </form>
    {% endif %}
</div>

</body>
</html>
